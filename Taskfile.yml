# https://taskfile.dev

version: "3"

includes:
  pi:
    taskfile: ./tools/pi/Taskfile.yml
    dir: .

vars:
  LOCALES:
    - de
    - fr
  PYTHON_VERSION: "3.11"
  HOST: "127.0.0.1"
  PORT: "5000"
  BASEDIR: "{{.HOME}}/.octoprint-atelier-local"

tasks:
  venv:
    desc: Prepare a uv-managed .venv, preserving any broken previous environment
    env:
      ATELIER_PYTHON: "{{.PYTHON_VERSION}}"
    cmds:
      - bash tools/dev-env.sh

  install:
    desc: Install OctoPrint with uv into the repository's .venv
    cmds:
      - task: venv
      # pip is an OctoPrint Plugin Manager runtime tool, not our installer.
      - uv pip install --python .venv/bin/python --editable . pip

  install-dev:
    desc: Install development, plugin and documentation dependencies with uv
    cmds:
      - task: venv
      - uv pip install --python .venv/bin/python --editable ".[develop,plugins,docs]" pip build

  init-dev:
    desc: Prepare the isolated uv environment and install the local development hooks
    cmds:
      - task: install-dev
      - .venv/bin/pre-commit install
      - git config blame.ignoreRevsFile .git-blame-ignore-revs

  dev:
    desc: Run Atelier locally without a Raspberry Pi or manual environment activation
    env:
      ATELIER_HOST: "{{.HOST}}"
      ATELIER_PORT: "{{.PORT}}"
      ATELIER_BASEDIR: "{{.BASEDIR}}"
    cmds:
      - task: install
      - task: babel-compile
      - task: babel-bundle
      - |
        printf 'Atelier: http://%s:%s/?l10n=fr\n' "$ATELIER_HOST" "$ATELIER_PORT"
        exec .venv/bin/octoprint serve \
          --basedir "$ATELIER_BASEDIR" \
          --host "$ATELIER_HOST" \
          --port "$ATELIER_PORT"

  check-deps:
    desc: List outdated packages in the repository's .venv
    cmds:
      - .venv/bin/pip-check -H

  scan-deps:
    desc: Scan dependencies in pyproject.toml for potential bound updates
    cmds:
      - .venv/bin/python tools/scan-deps.py

  pre-commit:
    desc: Run pre-commit on all files
    cmds:
      - .venv/bin/pre-commit run --all-files

  test:
    desc: Run test suites
    cmds:
      - task: test-unit
      - task: test-e2e

  test-unit:
    desc: Run unit tests
    cmds:
      - .venv/bin/python -m pytest

  test-e2e:
    desc: Run e2e tests
    cmds:
      - |
        export PATH="$PWD/.venv/bin:$PATH"
        cd tests/playwright
        npx playwright test --grep-invert "@isolated|@csrf"

  test-e2e-ui:
    desc: Run e2e tests interactively
    cmds:
      - |
        export PATH="$PWD/.venv/bin:$PATH"
        cd tests/playwright
        npx playwright test --ui

  test-e2e-install:
    desc: Install e2e test framework & dependencies
    cmds:
      - |
        cd tests/playwright
        npx playwright install

  test-qunit:
    desc: Runs QUnit tests via puppeteer
    cmds:
      - |
        cd tests/static/js
        npx node-qunit-puppeteer test-helpers.html
        npx node-qunit-puppeteer test-client-base.html

  test-qunit-install:
    desc: Install QUnit test dependencies
    cmds:
      - npx puppeteer install chrome

  ### Build related

  build:
    desc: Builds sdist & wheel
    cmds:
      - .venv/bin/python -m build --sdist --wheel

  build-sdist:
    desc: Builds sdist
    cmds:
      - .venv/bin/python -m build --sdist

  build-wheel:
    desc: Builds wheel
    cmds:
      - .venv/bin/python -m build --wheel

  update-assets:
    desc: Updates all assets
    cmds:
      - .venv/bin/octoprint dev css:build --all

  watch-assets:
    desc: Monitors all assets and builds them as needed
    cmds:
      - .venv/bin/octoprint dev css:watch --all

  ### Translation related

  babel-new:
    desc: Create a new translation for a locale, e.g. task babel-new -- de
    cmds:
      - task: babel-extract
      - |
        .venv/bin/pybabel init --input-file=translations/messages.pot --output-dir=translations --locale="{{ .CLI_ARGS }}"

  babel-extract:
    desc: Update pot file from source
    cmds:
      - .venv/bin/pybabel extract --mapping-file=babel.cfg --output-file=translations/messages.pot --msgid-bugs-address=i18n@octoprint.org --copyright-holder="The OctoPrint Project" .

  babel-update:
    desc: Update translation files from pot file
    cmds:
      - for:
          var: LOCALES
        cmd: .venv/bin/pybabel update --input-file=translations/messages.pot --output-dir=translations --locale={{ .ITEM }}

  babel-refresh:
    desc: Update translation files from source
    cmds:
      - task: babel-extract
      - task: babel-update

  babel-compile:
    desc: Compile translation files using the repository's Babel installation
    cmds:
      - .venv/bin/pybabel compile --directory=translations

  babel-bundle:
    desc: Bundle compiled translations
    preconditions:
      - sh: test -f translations/fr/LC_MESSAGES/messages.mo && test -f translations/de/LC_MESSAGES/messages.mo
        msg: Run task babel-compile successfully before bundling translations.
    cmds:
      - for:
          var: LOCALES
        cmd: |
          locale="{{ .ITEM }}"
          source="translations/${locale}"
          target="src/octoprint/translations/${locale}"

          [ ! -d "${target}" ] || rm -r "${target}"

          echo "Copying translations for locale ${locale} from ${source} to ${target}..."
          cp -r "${source}" "${target}"

  ### Docs related

  docs-serve:
    desc: Build & serve the docs with automatic updates
    cmds:
      - .venv/bin/sphinx-autobuild docs docs/_build/html

  docs-build:
    desc: Build the docs
    cmds:
      - .venv/bin/python -m sphinx.cmd.build -b html -v ./docs ./docs/_build

  docs-clean:
    desc: Clean docs output
    cmds:
      - rm -r ./docs/_build

  ### CI related

  ci-update:
    desc: Update GitHub Action workflow files to new versions of used actions
    cmds:
      - npx actions-up --include-branches
