name: Prepare Atelier corrections
on:
  push:
    branches: [feat/atelier-mobile-tablet]
    paths: [.github/workflows/atelier-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'didlawowo/OctoPrint' && github.ref == 'refs/heads/feat/atelier-mobile-tablet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_VERSION_BRANCH: feat/atelier-mobile-tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Apply the pinned correction script and run all formatters and unit tests
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import subprocess
          import yaml
          source = subprocess.check_output([
              'git', 'show', 'd2c1e1b1dde892267356f1422f2b5a58a8a8a188:.github/workflows/atelier-prepare.yml'
          ], text=True)
          steps = yaml.safe_load(source)['jobs']['prepare']['steps']
          for index in (2, 3):
              subprocess.run(['bash', '-eo', 'pipefail', '-c', steps[index]['run']], check=True)
          PY
      - name: Export reviewed changes without any repository write permission
        run: |
          mkdir -p /tmp/atelier-corrections
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          paths = git('diff', '--name-only', 'HEAD').splitlines()
          allowed = ('src/octoprint/plugins/atelier/', 'src/octoprint/_version.py',
                     'tools/pi/', 'tests/atelier/', 'tests/playwright/specs/atelier.spec.js',
                     'tests/playwright/fixtures.js', '.github/workflows/atelier.yml',
                     '.github/workflows/atelier-prepare.yml', '.pre-commit-config.yaml',
                     'Taskfile.yml', 'docs/fork/atelier.md')
          assert paths and all(p.startswith(allowed) for p in paths), paths
          entries = []
          for name in paths:
              path = Path(name)
              if not path.exists():
                  assert name == '.github/workflows/atelier-prepare.yml'
                  entry = {'path': name, 'mode': '100644', 'type': 'blob', 'sha': None}
              else:
                  entry = {'path': name, 'mode': '100755' if os.access(path, os.X_OK) else '100644',
                           'type': 'blob', 'content': path.read_text()}
              entries.append(entry)
              print('TREE_ENTRY_JSON=' + json.dumps(entry))
          payload = {'parent_sha': git('rev-parse', 'HEAD'), 'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries}
          Path('/tmp/atelier-corrections/tree.json').write_text(json.dumps(payload, indent=2))
          print('PARENT_COMMIT_SHA=' + payload['parent_sha'])
          print('BASE_TREE_SHA=' + payload['base_tree'])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atelier-corrections
          path: /tmp/atelier-corrections/tree.json
          retention-days: 1
